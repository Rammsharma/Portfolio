<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Neural network dots -->
  <circle cx="8"  cy="10" r="2.2" fill="url(#dot)"/>
  <circle cx="8"  cy="22" r="2.2" fill="url(#dot)"/>
  <circle cx="16" cy="7"  r="2.2" fill="url(#dot)"/>
  <circle cx="16" cy="16" r="2.2" fill="url(#dot)"/>
  <circle cx="16" cy="25" r="2.2" fill="url(#dot)"/>
  <circle cx="24" cy="10" r="2.2" fill="url(#dot)"/>
  <circle cx="24" cy="22" r="2.2" fill="url(#dot)"/>

  <!-- Connections -->
  <line x1="8"  y1="10" x2="16" y2="7"  stroke="#60a5fa" stroke-width="1.1" stroke-opacity="0.7"/>
  <line x1="8"  y1="10" x2="16" y2="16" stroke="#60a5fa" stroke-width="1.1" stroke-opacity="0.7"/>
  <line x1="8"  y1="22" x2="16" y2="16" stroke="#60a5fa" stroke-width="1.1" stroke-opacity="0.7"/>
  <line x1="8"  y1="22" x2="16" y2="25" stroke="#60a5fa" stroke-width="1.1" stroke-opacity="0.7"/>
  <line x1="16" y1="7"  x2="24" y2="10" stroke="#06b6d4" stroke-width="1.1" stroke-opacity="0.7"/>
  <line x1="16" y1="16" x2="24" y2="10" stroke="#06b6d4" stroke-width="1.1" stroke-opacity="0.7"/>
  <line x1="16" y1="16" x2="24" y2="22" stroke="#06b6d4" stroke-width="1.1" stroke-opacity="0.7"/>
  <line x1="16" y1="25" x2="24" y2="22" stroke="#06b6d4" stroke-width="1.1" stroke-opacity="0.7"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111d35"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>
